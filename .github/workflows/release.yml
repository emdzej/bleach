name: Release

on:
  push:
    # Bare semver tags, no `v` prefix. `[0-9]+` means one or more digits in
    # GitHub's filter-pattern syntax; the second pattern covers prereleases
    # such as 0.2.0-rc1.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # The tag *is* the version — no prefix to strip.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            [0-9]*) ;;
            *) echo "::error::tag '$TAG' is not a bare semver version" && exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$( [ "${TAG#*-}" != "$TAG" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      # Keep `bleach --version` honest: the source default is a placeholder,
      # the tag is the truth.
      - name: Stamp version from tag
        run: |
          sed -i '' \
            's/version: "[0-9][^"]*"/version: "${{ steps.version.outputs.version }}"/' \
            Sources/bleach/Bleach.swift
          grep -n 'version: "' Sources/bleach/Bleach.swift

      - name: Test before shipping
        run: swift test

      # Built one architecture at a time and lipo'd together, rather than with
      # SwiftPM's `--arch a --arch b`. That flag routes through a build path
      # which fails on Xcode 16.4 / Swift 6.1.2 with "Unexpected duplicate
      # tasks" and "missing target configuration". Separate scratch paths plus
      # lipo is toolchain-agnostic.
      - name: Build per-architecture slices
        run: |
          swift build -c release --triple arm64-apple-macosx13.0  --scratch-path .build-arm
          swift build -c release --triple x86_64-apple-macosx13.0 --scratch-path .build-x86

      - name: Create universal binary
        run: |
          ARM="$(swift build -c release --triple arm64-apple-macosx13.0  --scratch-path .build-arm --show-bin-path)"
          X86="$(swift build -c release --triple x86_64-apple-macosx13.0 --scratch-path .build-x86 --show-bin-path)"
          mkdir -p slices
          cp "$ARM/bleach" slices/bleach-arm64
          cp "$X86/bleach" slices/bleach-x86_64
          lipo -create -output slices/bleach-universal slices/bleach-arm64 slices/bleach-x86_64

          # Strip local and debug symbols. Roughly halves each binary and
          # costs nothing: exported symbols survive, so crash backtraces still
          # symbolise.
          for f in slices/bleach-*; do
            echo "$f: $(stat -f%z "$f") bytes before"
            strip -rSTx "$f"
            echo "$f: $(stat -f%z "$f") bytes after"
          done
          lipo -info slices/bleach-universal

      - name: Verify every slice runs
        run: |
          for arch in arm64 x86_64 universal; do
            f="slices/bleach-$arch"
            lipo -info "$f"
            # An x86_64 binary runs here only under Rosetta, which the runner
            # may not have, so only execute the ones native to arm64.
            case "$arch" in
              x86_64) echo "  (skipping execution: not native to this runner)" ;;
              *)
                test "$("$f" --version)" = "${{ steps.version.outputs.version }}"
                echo "  runs, reports ${{ steps.version.outputs.version }}"
                ;;
            esac
          done
          lipo -info slices/bleach-universal | grep -q arm64
          lipo -info slices/bleach-universal | grep -q x86_64

      - name: Package
        run: |
          mkdir -p dist
          # One tarball per architecture. Unversioned names, because
          # releases/download/<tag>/<name> already pins a version and
          # releases/latest/download/<name> needs the name to be stable —
          # versioned duplicates would just double the assets.
          for arch in universal arm64 x86_64; do
            stage="stage-$arch"
            mkdir -p "$stage"
            cp "slices/bleach-$arch" "$stage/bleach"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            # Bundle the example plugins so a fresh install can try them via
            # BLEACH_PLUGIN_PATH without cloning the repo.
            cp -R plugins "$stage/plugins"
            tar czf "dist/bleach-macos-$arch.tar.gz" -C "$stage" .
          done

          cd dist
          for f in *.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la
          cat *.sha256

      - name: Generate release notes
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          {
            REPO='${{ github.repository }}'
            echo "## Install"
            echo
            echo '```sh'
            echo '# picks the right slice for your Mac (arm64 or x86_64)'
            echo "curl -fsSL https://github.com/$REPO/releases/download/$VERSION/bleach-macos-\$(uname -m).tar.gz | tar xz"
            echo 'sudo mv bleach /usr/local/bin/'
            echo
            echo '# unsigned build — clear the Gatekeeper attribute on first run:'
            echo 'xattr -d com.apple.quarantine /usr/local/bin/bleach'
            echo '```'
            echo
            echo "macOS 13+. Three builds, pick one:"
            echo
            echo "| Asset | For |"
            echo "|---|---|"
            echo "| \`bleach-macos-arm64.tar.gz\` | Apple silicon |"
            echo "| \`bleach-macos-x86_64.tar.gz\` | Intel |"
            echo "| \`bleach-macos-universal.tar.gz\` | both, if you need one binary for a fleet |"
            echo
            echo "Verify with \`shasum -a 256 -c bleach-macos-<arch>.tar.gz.sha256\`."
            echo
            echo "Docs: https://bleach.emdzej.pl"
            echo

            # Prefer the maintained changelog: extract this version's section,
            # from its heading up to the next version heading.
            if [ -f CHANGELOG.md ] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              # Stop at the next version heading, or at the link-reference
              # definitions when this is the oldest section in the file.
              awk -v v="$VERSION" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
                found { print }
              ' CHANGELOG.md
            else
              echo "## Changes"
              echo
              PREV="$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)"
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV..$VERSION"
                echo
                echo "**Full diff**: https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
              else
                echo "First release."
              fi
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "bleach ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/*.tar.gz dist/*.sha256
