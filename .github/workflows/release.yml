name: Release

on:
  push:
    # Bare semver tags, no `v` prefix. `[0-9]+` means one or more digits in
    # GitHub's filter-pattern syntax; the second pattern covers prereleases
    # such as 0.2.0-rc1.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # The tag *is* the version — no prefix to strip.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            [0-9]*) ;;
            *) echo "::error::tag '$TAG' is not a bare semver version" && exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$( [ "${TAG#*-}" != "$TAG" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      # Keep `bleach --version` honest: the source default is a placeholder,
      # the tag is the truth.
      - name: Stamp version from tag
        run: |
          sed -i '' \
            's/version: "[0-9][^"]*"/version: "${{ steps.version.outputs.version }}"/' \
            Sources/bleach/Bleach.swift
          grep -n 'version: "' Sources/bleach/Bleach.swift

      - name: Test before shipping
        run: swift test

      # Built one architecture at a time and lipo'd together, rather than with
      # SwiftPM's `--arch a --arch b`. That flag routes through a build path
      # which fails on Xcode 16.4 / Swift 6.1.2 with "Unexpected duplicate
      # tasks" and "missing target configuration". Separate scratch paths plus
      # lipo is toolchain-agnostic.
      - name: Build per-architecture slices
        run: |
          swift build -c release --triple arm64-apple-macosx13.0  --scratch-path .build-arm
          swift build -c release --triple x86_64-apple-macosx13.0 --scratch-path .build-x86

      - name: Create universal binary
        run: |
          ARM="$(swift build -c release --triple arm64-apple-macosx13.0  --scratch-path .build-arm --show-bin-path)"
          X86="$(swift build -c release --triple x86_64-apple-macosx13.0 --scratch-path .build-x86 --show-bin-path)"
          mkdir -p universal
          lipo -create -output universal/bleach "$ARM/bleach" "$X86/bleach"
          echo "BIN_PATH=$PWD/universal" >> "$GITHUB_ENV"
          lipo -info universal/bleach

      - name: Verify it runs and is universal
        run: |
          "$BIN_PATH/bleach" --version
          lipo -info "$BIN_PATH/bleach" | grep -q arm64
          lipo -info "$BIN_PATH/bleach" | grep -q x86_64
          # The stamped version must match the tag we are publishing.
          test "$("$BIN_PATH/bleach" --version)" = "${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          mkdir -p dist/bleach
          cp "$BIN_PATH/bleach" dist/bleach/
          cp README.md LICENSE dist/bleach/
          # Bundle the example plugins so a fresh install can try them via
          # BLEACH_PLUGIN_PATH without cloning the repo.
          cp -R plugins dist/bleach/plugins

          cd dist
          # Stable name, so releases/latest/download/ URLs keep working.
          tar czf bleach-macos-universal.tar.gz -C bleach .
          # Versioned name, for pinning.
          cp bleach-macos-universal.tar.gz \
             "bleach-${{ steps.version.outputs.version }}-macos-universal.tar.gz"

          for f in *.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la
          cat *.sha256

      - name: Generate release notes
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          {
            echo "## Install"
            echo
            echo '```sh'
            echo 'curl -fsSL https://github.com/${{ github.repository }}/releases/download/'"$VERSION"'/bleach-macos-universal.tar.gz | tar xz'
            echo 'sudo mv bleach /usr/local/bin/'
            echo '# unsigned build — clear the Gatekeeper attribute on first run:'
            echo 'xattr -d com.apple.quarantine /usr/local/bin/bleach'
            echo '```'
            echo
            echo "Universal binary (arm64 + x86_64), macOS 13+."
            echo "Verify with \`shasum -a 256 -c bleach-macos-universal.tar.gz.sha256\`."
            echo
            echo "Docs: https://bleach.emdzej.pl"
            echo

            # Prefer the maintained changelog: extract this version's section,
            # from its heading up to the next version heading.
            if [ -f CHANGELOG.md ] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              # Stop at the next version heading, or at the link-reference
              # definitions when this is the oldest section in the file.
              awk -v v="$VERSION" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
                found { print }
              ' CHANGELOG.md
            else
              echo "## Changes"
              echo
              PREV="$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)"
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV..$VERSION"
                echo
                echo "**Full diff**: https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
              else
                echo "First release."
              fi
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "bleach ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/*.tar.gz dist/*.sha256
